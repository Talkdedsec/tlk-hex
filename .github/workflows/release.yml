name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      VER: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 1) Portable: kendi kendine yeten tek dosya (.NET kurulumu GEREKMEZ)
      - name: Publish portable (self-contained, single file)
        run: >
          dotnet publish tlk-hex.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish-portable
      - name: Package portable
        shell: pwsh
        run: |
          Copy-Item publish-portable/tlk-hex.exe "tlk-hex-$env:VER-win-x64-portable.exe"
          Compress-Archive -Path "tlk-hex-$env:VER-win-x64-portable.exe" -DestinationPath "tlk-hex-$env:VER-win-x64.zip" -Force

      # 2) Framework-dependent: daha küçük (.NET 10 Desktop runtime gerekir)
      - name: Publish framework-dependent (single file)
        run: >
          dotnet publish tlk-hex.csproj -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish-fx
      - name: Package framework-dependent
        shell: pwsh
        run: |
          Copy-Item publish-fx/tlk-hex.exe "tlk-hex-$env:VER-win-x64-framework-dependent.exe"
          Compress-Archive -Path "tlk-hex-$env:VER-win-x64-framework-dependent.exe" -DestinationPath "tlk-hex-$env:VER-win-x64-fx.zip" -Force

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$VER" >/dev/null 2>&1; then
            gh release create "$VER" --title "tlk-hex $VER" --generate-notes
          fi
          gh release upload "$VER" \
            "tlk-hex-$VER-win-x64-portable.exe" \
            "tlk-hex-$VER-win-x64.zip" \
            "tlk-hex-$VER-win-x64-fx.zip" \
            --clobber

      # Scoop + winget manifestlerini gercek surum/sha ile yenile ve main'e isle
      - name: Update install manifests
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = $env:VER.TrimStart('v')
          $zip = "tlk-hex-$env:VER-win-x64.zip"
          $exe = "tlk-hex-$env:VER-win-x64-portable.exe"
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          $scoop = @"
          {
              "version": "$ver",
              "description": "tlk-hex - interactive disassembler for Windows (IDA-style text and graph views, PDB symbols, hex patching).",
              "homepage": "https://github.com/Talkdedsec/tlk-hex",
              "license": "MIT with Commons Clause",
              "notes": "Portable build - no .NET install required. Run 'tlk-hex' or launch from the Start menu shortcut.",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/Talkdedsec/tlk-hex/releases/download/v$ver/tlk-hex-v$ver-win-x64.zip",
                      "hash": "$zipSha"
                  }
              },
              "bin": [["tlk-hex-v$ver-win-x64-portable.exe", "tlk-hex"]],
              "shortcuts": [["tlk-hex-v$ver-win-x64-portable.exe", "tlk-hex"]],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": { "url": "https://github.com/Talkdedsec/tlk-hex/releases/download/v`$version/tlk-hex-v`$version-win-x64.zip" }
                  },
                  "bin": [["tlk-hex-v`$version-win-x64-portable.exe", "tlk-hex"]],
                  "shortcuts": [["tlk-hex-v`$version-win-x64-portable.exe", "tlk-hex"]]
              }
          }
          "@
          Set-Content -Path packaging/scoop/tlk-hex.json -Value $scoop -Encoding utf8

          # winget: surum ve installer sha'yi guncelle (satir bazli)
          foreach ($f in @('packaging/winget/Talkdedsec.tlk-hex.yaml',
                           'packaging/winget/Talkdedsec.tlk-hex.installer.yaml',
                           'packaging/winget/Talkdedsec.tlk-hex.locale.en-US.yaml')) {
            (Get-Content $f) `
              -replace 'PackageVersion: .*', "PackageVersion: $ver" `
              -replace 'releases/download/v[0-9.]+/tlk-hex-v[0-9.]+-win-x64-portable\.exe', "releases/download/v$ver/tlk-hex-v$ver-win-x64-portable.exe" `
              -replace 'releases/tag/v[0-9.]+', "releases/tag/v$ver" `
              -replace 'InstallerSha256: .*', "InstallerSha256: $exeSha" |
              Set-Content $f -Encoding utf8
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add packaging/scoop/tlk-hex.json packaging/winget/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "packaging: refresh manifests for $env:VER"
            git push origin main
          }
