name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      VER: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 1) Portable: kendi kendine yeten tek dosya (.NET kurulumu GEREKMEZ)
      - name: Publish portable (self-contained, single file)
        run: >
          dotnet publish tlk-hex.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish-portable
      - name: Package portable
        shell: pwsh
        run: |
          Copy-Item publish-portable/tlk-hex.exe "tlk-hex-$env:VER-win-x64-portable.exe"
          Compress-Archive -Path "tlk-hex-$env:VER-win-x64-portable.exe" -DestinationPath "tlk-hex-$env:VER-win-x64.zip" -Force

      # 2) Framework-dependent: daha küçük (.NET 10 Desktop runtime gerekir)
      - name: Publish framework-dependent (single file)
        run: >
          dotnet publish tlk-hex.csproj -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish-fx
      - name: Package framework-dependent
        shell: pwsh
        run: |
          Copy-Item publish-fx/tlk-hex.exe "tlk-hex-$env:VER-win-x64-framework-dependent.exe"
          Compress-Archive -Path "tlk-hex-$env:VER-win-x64-framework-dependent.exe" -DestinationPath "tlk-hex-$env:VER-win-x64-fx.zip" -Force

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$VER" >/dev/null 2>&1; then
            gh release create "$VER" --title "tlk-hex $VER" --generate-notes
          fi
          gh release upload "$VER" \
            "tlk-hex-$VER-win-x64-portable.exe" \
            "tlk-hex-$VER-win-x64.zip" \
            "tlk-hex-$VER-win-x64-fx.zip" \
            --clobber
