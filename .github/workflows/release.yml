name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish (win-x64, tek dosya)
        run: >
          dotnet publish tlk-hex.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish
      - name: Paketle
        run: Compress-Archive -Path publish/* -DestinationPath tlk-hex-${{ github.ref_name }}-win-x64.zip
      - name: Sürüm oluştur / güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "tlk-hex ${{ github.ref_name }}" --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" "tlk-hex-${{ github.ref_name }}-win-x64.zip" --clobber
