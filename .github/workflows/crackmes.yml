name: crackmes
on:
  push:
    tags: ['crackmes-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crackmes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate sources
        working-directory: crackmes
        run: python gen.py
      - name: Compile (preinstalled MinGW gcc)
        working-directory: crackmes
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/ProgramData/mingw64/mingw64/bin:$PATH"
          gcc --version
          mkdir -p bin
          for n in 01 02 03 04 05 06; do
            gcc -O2 -s -o "bin/crackme$n.exe" "src/crackme$n.c"
          done
          ls -l bin
      - name: Bundle
        working-directory: crackmes
        shell: pwsh
        run: Compress-Archive -Path bin/*.exe, README.md -DestinationPath tlk-hex-crackmes.zip -Force
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crackmes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Practice crackmes ($TAG)" --notes-file README.md
          fi
          gh release upload "$TAG" bin/crackme0*.exe tlk-hex-crackmes.zip --clobber
