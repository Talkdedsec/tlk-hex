ShortDescription: Interactive disassembler for Windows - IDA-style text and graph views, PDB symbols, hex patching.
Description: >-
  tlk-hex is a free, source-available interactive disassembler for Windows. It loads PE, ELF and raw
  binaries, disassembles x86/x64 with recursive traversal, and offers IDA-style text and control-flow
  graph views, cross-references, stack-variable analysis, C-like pseudocode, a powerful search panel,
  Microsoft PDB symbol download, and in-place hex patching. For authorized analysis, education and research.
